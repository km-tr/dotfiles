[tools]
bun = "1.4.0"
node = "26.6.0"
pnpm = "11"

[settings]
idiomatic_version_file_enable_tools = ["node"]

[settings.aqua]
baked_registry = true

[env]
ENABLE_LSP_TOOL=1

[tasks.copy-local-files]

run = """
#!/usr/bin/env bash

SRC=~/hoge/auto_reserve_front
DEST="$(pwd)"

(
  cd "$SRC"
  find . \\( -type d \\( -name node_modules -o -name .git -o -name .history \\) -prune \\) -o \
         \\( -type f -o -type l -o -type d \\) \\( \
            -name '.env' -o \
            -path './.vscode/*' -o \
            \\( -name '*.local' -a ! -name '.xcode.env.local' \\) -o \
            -name '*.local.md' -o \
            -name '.mise.local.toml' -o \
            -name '.cursorrules' -o \
            -name 'AGENTS.md' -o \
            -name 'local' -o \
            -path './*/local/*.md' -o \
            -path './*/.vercel/*' -o \
            -path './.cursor/*' -o \
            -name '*.local.json' \
         \\) -print0
) | rsync -av --from0 --relative --files-from=- "$SRC/" "$DEST/"
"""
