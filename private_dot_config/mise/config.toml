[tools]
bun = "1.4.0"
node = "26.12.1"
pnpm = "11.28.8"
# ai-config の README: 0.35 系は登録済みスキルを削除する不具合があるため固定する
"github:microsoft/apm" = "0.34.0"
"npm:@playwright/cli" = "0.1.25"
"npm:agent-browser" = "0.43.0"
"npm:agent-cdp" = "1.6.1"
"npm:agent-device" = "0.21.39"
"npm:agent-slack" = "0.10.2"
"npm:ccstatusline" = "2.2.34"
"npm:eas-cli" = "27.10.0"
"npm:mcporter" = "0.17.1"
"npm:modern-web-guidance" = "1.0.1"
"npm:typescript-language-server" = "6.1.0"
"aqua:openai/codex" = "0.171.0"
"aqua:anthropics/claude-code" = "2.1.330"
"aqua:earendil-works/pi" = "1.6.0"
"github:getsentry/toolkit" = { version = "0.50.0", version_prefix = "cli@", asset_pattern = 'sentry-{{ os(macos="darwin") }}-{{ arch() }}{{ os(windows=".exe", macos="", linux="") }}', bin = "sentry" }
grok = "1.0.77"

[settings]
idiomatic_version_file_enable_tools = ["node"]

[settings.aqua]
baked_registry = true

[env]
ENABLE_LSP_TOOL=1
